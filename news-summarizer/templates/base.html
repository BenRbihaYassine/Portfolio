<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Résumeur d'articles{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <header class="masthead">
        <div class="masthead-inner">
            <a href="{{ url_for('index') }}" class="masthead-title">
                <span class="eyebrow">Édition numérique</span>
                <span class="title-main">Résumeur</span>
            </a>
            <nav class="masthead-nav">
                <a href="{{ url_for('index') }}" class="{{ 'active' if request.path == '/' else '' }}">Nouveau résumé</a>
                <a href="{{ url_for('historique') }}" class="{{ 'active' if request.path == '/historique' else '' }}">Historique</a>
            </nav>
        </div>
    </header>

    <main class="page">
        {% block content %}{% endblock %}
    </main>

    <footer class="site-footer">
        <p>Résumeur automatique d'articles de presse </p>
    </footer>

    {% block scripts %}{% endblock %}
</body>
</html>
